name: opentelemetry-tracing-all-in-one
version: 0.1.0
description: One-step install of every Qubership OpenTelemetry tracing language package (Java, Go, Python, TypeScript) plus the shared core. Use when the target repository's language is unknown or spans several languages — the agent gets every discovery/detection/recipe set at once and picks the right one per service, without the user choosing a language up front.
author: Qubership

# Depends on every language package. Each one declares
# opentelemetry-tracing-common (via git ref) in its own apm.yml, so the shared
# core arrives transitively; APM resolves it once and dedupes. Do not list the
# common here — keep a single place (the language package) deciding which
# common version it gets.
#
# LOCAL TEST ONLY: local_path (../...) deps replaced with git-ref deps here
# because a remote-fetched package (owner/repo#ref) cannot resolve local_path
# deps against the consumer's filesystem. Do not commit this — see
# https://github.com/Netcracker/qubership-jaeger/issues (open a ticket) for the
# real fix.
dependencies:
  apm:
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-java
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-go
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-python
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-ts

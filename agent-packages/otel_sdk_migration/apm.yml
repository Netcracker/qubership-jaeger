name: opentelemetry-tracing
version: 0.1.0
description: Aggregator for the Qubership OpenTelemetry tracing skills. Installs every language package (Java, Go, Python, TypeScript) plus the shared common core in one step, so an agent can audit and migrate tracing in a repository without the user knowing which language the service is written in.
author: Qubership

dependencies:
  apm:
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-java
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-go
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-python
    - Netcracker/qubership-jaeger/agent-packages/otel_sdk_migration/opentelemetry-tracing-ts

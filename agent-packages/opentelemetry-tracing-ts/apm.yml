name: opentelemetry-tracing-ts
version: 0.1.0
description: Audits and migrates distributed tracing in Qubership TypeScript/Node services (Express, Fastify, NestJS, pure Node OTel SDK) to OpenTelemetry via OTLP and Jaeger. Five-layer pipeline (discovery, capability, maturity, transformation, validation). Use for legacy/hybrid/incomplete OTel, TRACING_* and OTLP work, ESM/bundler and import-order pitfalls, worker_threads/child_process/Kafka async context loss, and tracing tasks without naming the skill package.
author: Qubership

dependencies:
  apm:
    - ../opentelemetry-tracing-common

# Default values for jaeger.
# This is a YAML-formatted file.
# yamllint disable rule:comments-indentation

# -- Cloud passport parameter that defines which kind of ingress resources have to be created.
# May contain several comma-separated values, for example "legacy-ingress,gateway-api-default":
#   * legacy-ingress      - create Ingress resources
#   * gateway-api-default - create Gateway API resources (HTTPRoute/GRPCRoute) and add the
#                           "gateway-api-converter.netcracker.com/ignore" annotation to Ingresses
# GATEWAY_SYSTEM_TYPE: ""

# -- Name of the shared external Gateway the created routes are attached to. Used only when the route does not specify its own "httpRoute/grpcRoute.parentRefs".
# GATEWAY_SYSTEM_NAME: "default-external-gateway"

# -- Namespace of the shared external Gateway the created routes are attached to. Used only when the route does not specify its own "httpRoute/grpcRoute.parentRefs".
# GATEWAY_SYSTEM_NAMESPACE: "gateway-system"

# -- Global jaeger configuration
jaeger:
  # -- Name of jaeger service.
  serviceName: jaeger

  # -- Allow creating a service monitor that sends Jaeger metrics to prometheus.
  prometheusMonitoring: true

  # -- Allow creating a grafana dashboard for jaeger.
  prometheusMonitoringDashboard: true

  # -- Specify type of storage for jaeger. E.g. 'elasticsearch', 'cassandra' or 'remotegRPC'.
  storage:
    type: cassandra

# -- Proxy configuration
# @default -- see the rows below
proxy:
  # -- Allow disabling create envoy proxy container.
  install: false

  # -- A docker image to use for envoy container.
  # image: "envoyproxy/envoy:v1.35.2"

  # -- Authentication type to be used. Available values - "basic" and "oauth2"
  type: "basic"

  access_logs_enabled: true

  # --  Settings for oauth2 authentication.
  oauth2:

    # -- Endpoint on the authorization server to retrieve the access token from.
    # Example: `http://my-keycloak.com/auth/realms/test/protocol/openid-connect/token`
    tokenEndpoint: ""

    # -- The endpoint redirect to for authorization in response to unauthorized requests.
    # Example: `http://my-keycloak.com/auth/realms/test/protocol/openid-connect/auth`
    authorizationEndpoint: ""

    # -- The client_id to be used in the authorize calls. This value will be URL encoded when sent to the OAuth server.
    clientId: ""

    # -- The secret used to retrieve the access token. This value will be URL encoded when sent to the OAuth server.
    clientToken: ""

    # -- The address for this socket. Listeners will bind to the address. An empty address is not allowed.
    # Specify 0.0.0.0 or :: to bind to any address. For clusters, the cluster type determines whether the address must be an IP or a hostname resolved by DNS.
    # Example: `my-keycloak.com`
    idpAddress: ""

    # -- Listeners will bind to the port.
    idpPort: 80

  # -- Settings for basic authentication.
  basic:

    # -- List of login:password in base64.
    # For example:
    #   admin:admin -> YWRtaW46YWRtaW4=
    #   test:test -> dGVzdDp0ZXN0
    users:
    - YWRtaW46YWRtaW4=
    - dGVzdDp0ZXN0

  # -- The resources describe to compute resource requests and limits for single Pods.
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 100Mi

  # -- SecurityContext holds pod-level security attributes.
  securityContext: {}
  #   runAsUser: 2000
  #   fsGroup: 2000

  # -- SecurityContext holds container-level security attributes.
  containerSecurityContext: {}
    # -- Controls whether a process can gain more privileges than its parent process.
    # allowPrivilegeEscalation: false

    # -- Allow to give or drop a process some privileges, but not all the privileges of the root user.
    # capabilities:
    #   drop:
    #     - ALL

# -- OpenSearch/Elasticsearch configuration
# @default -- see the rows below
elasticsearch:
  # -- Name of existing secret with elasticsearch username and password.
  existingSecret: ""

  # -- Index prefix for elasticsearch.
  indexPrefix: ""

  # -- Elasticsearch related extra env vars to be configured on the concerned components.
  extraEnv: []

  # Additional Jaeger v2 runtime storage settings for Elasticsearch/OpenSearch.
  # These fields are optional: if omitted, Jaeger internal defaults are used.
  #
  # remoteReadClusters:
  # - remote-cluster
  #
  # disableHealthCheck: true
  # sendGetBodyAs: GET
  # queryTimeout: 30s
  # httpCompression: false
  #
  # version: 8
  # logLevel: debug
  #
  # useAliases: true
  # createMappings: false
  # useIlm: true
  #
  # maxDocCount: 20000
  # maxSpanAge: 72h
  # serviceCacheTtl: 1h
  # adaptiveSamplingLookback: 72h
  #
  # customHeaders:
  #   Host: my-opensearch-domain.example.com
  #
  # sniffing:
  #   enabled: true
  #   useHttps: true
  #
  # bulkProcessing:
  #   maxBytes: 5000000
  #   maxActions: 1000
  #   flushInterval: 200ms
  #   workers: 1
  #
  # tagsAsFields:
  #   all: true
  #   dotReplacement: "@"
  #   configFile: /etc/jaeger/tags-as-fields.yaml
  #   include: http.status_code,error
  #
  indices: {}
    # spans:
    #   dateLayout: "2006-01-02"
    #   rolloverFrequency: day
    #   shards: 1
    #   replicas: 0
    #   priority: 100
    #
    # services:
    #   dateLayout: "2006-01-02"
    #   rolloverFrequency: day
    #   shards: 1
    #   replicas: 0
    #   priority: 100
    #
    # dependencies:
    #   dateLayout: "2006-01-02"
    #   rolloverFrequency: day
    #   shards: 1
    #   replicas: 0
    #   priority: 100
    #
    # sampling:
    #   dateLayout: "2006-01-02"
    #   rolloverFrequency: day
    #   shards: 1
    #   replicas: 0
    #   priority: 100

  client:
    # -- Username for Elasticsearch with access to HTTP API.
    username: ""

    # -- Password for Elasticsearch with access to HTTP API.
    password: ""

    # --This is the URL with port used to connect to Elasticsearch.
    url: ""

    # -- Scheme for elasticsearch.
    scheme: http

    tls:
      # -- Allow disabling create tls.
      enabled: false

      # -- Name of existing secret with SSL certificates. If specified, all subsequent parameters in tls section are ignored.
      existingSecret: ""

      # -- Allow to specify common name - server name protected by the SSL certificate. Ignored if the existingSecret is specified.
      # commonName:

      # -- Allow to specify CA certificate. It use to provide list of trusted CA who issued the certificates. Mandatory field when using SSL connection to OpenSearch. Ignored if the existingSecret is specified.
      # ca: |
      #   -----BEGIN CERTIFICATE-----
      #   ...
      #   -----END CERTIFICATE-----

      # -- Allow to specify public key of certificate. Mandatory field when using SSL connection to OpenSearch. Ignored if the existingSecret is specified.
      # cert: |
      #   -----BEGIN CERTIFICATE-----
      #   ...
      #   -----END CERTIFICATE-----

      # -- Allow to specify private part of certificate. Mandatory field when using SSL connection to OpenSearch. Ignored if the existingSecret is specified.
      # key: |
      #   -----BEGIN RSA PRIVATE KEY-----
      #   ...
      #   -----END RSA PRIVATE KEY-----

      # insecureSkipVerify: false

  # -- Enables Jaeger Elasticsearch/OpenSearch read/write aliases by setting
  # `use_aliases: true` in jaeger_storage Elasticsearch backend configuration.
  # This option is required when Elasticsearch/OpenSearch rollover is used.
  # Rollover init job must create aliases/templates before collector and query
  # start using this option. Without aliases Jaeger writes to daily indices such
  # as `jaeger-span-YYYY-MM-DD`.
  useAliases: false

  indexCleaner:
    # -- Allow disabling create index cleaner cronJob.
    install: false

    # -- A docker image to use for index cleaner cronJob.
    # image: "jaegertracing/jaeger-es-index-cleaner:1.76.0"

    # -- A name of a microservice to deploy with.
    # This name will be used as name of the microservice cronjob and in labels.
    name: index-cleaner

    # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet attempts to pull (download) the specified image. Available value : "IfNotPresent", "Always" and "Never"
    imagePullPolicy: IfNotPresent

    # -- Only pods which provide own keys can access the private registry.
    imagePullSecrets: []

    # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
    labels: {}
    #  label-key: label-value

    # Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
    # They are not queryable and should be preserved when modifying objects.
    annotations: {}
    #  annotation-key: annotation-value

    # -- It specifies how to treat concurrent executions of a job that is created by this cron job.
    #   - Allow: The cron job allows concurrently running jobs.
    #   - Forbid: The cron job does not allow concurrent runs; if it is time for a new job run and the previous job
    #             run hasn't finished yet, the cron job skips the new job run
    #   - Replace: If it is time for a new job run and the previous job run hasn't finished yet, the cron job
    #            replaces the currently running job run with a new job run
    concurrencyPolicy: Forbid

    # -- Specify schedule time of its jobs to be created and executed.
    schedule: "55 23 * * *"

    # -- Parameter specify how many completed jobs should be kept.
    successfulJobsHistoryLimit: 1

    # -- Parameter specify how many failed jobs should be kept.
    failedJobsHistoryLimit: 1

    # -- Allow to set time to life (TTL) for TTL controller. TTL controller cleans up the Job, it will delete the Job
    # cascading, i.e. delete its dependent objects, such as Pods, together with the Job.
    # Useful to set a value other than 0 if you want to see job logs.
    ttlSecondsAfterFinished: 0

    # -- SecurityContext holds pod-level security attributes.
    securityContext: {}

    # -- SecurityContext holds container-level security attributes.
    containerSecurityContext: {}

    # -- Specify number of day that job will be executed.
    numberOfDays: 7

    # -- indexCleaner related extra env vars to be configured on the concerned components.
    extraEnv: []

    # -- Specify extra configMap mounts for indexCleaner.
    extraConfigmapMounts: []

    # -- Specify extra secret mounts for indexCleaner.
    extraSecretMounts: []

    # -- Allow defining which Nodes the Pods are scheduled on.
    nodeSelector: {}

    # -- Tolerations allow the pods to schedule onto nodes with matching taints.
    tolerations: {}

    # -- The resources describe to compute resource requests and limits for single Pods. Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # -- PriorityClassName assigned to the Pods to prevent them from evicting.
    # priorityClassName: "priorityClassName"

  # -- Lookback job configuration
  # @default -- see the rows below
  lookback:
    # -- Allow disabling create lookback cronJob.
    install: false

    # -- A name of a microservice to deploy with. This name will be used as name of the microservice cronjob and in labels.
    name: lookback

    # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet attempts to pull (download) the specified image.
    # Available value : "IfNotPresent", "Always" and "Never"
    imagePullPolicy: IfNotPresent

    # -- Only pods which provide own keys can access the private registry.
    imagePullSecrets: []

    # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
    labels: {}

    # -- Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
    annotations: {}

    # -- It specifies how to treat concurrent executions of a job that is created by this cron job.
    #   - Allow: The cron job allows concurrently running jobs.
    #   - Forbid: The cron job does not allow concurrent runs; if it is time for a new job run and the previous job
    #             run hasn't finished yet, the cron job skips the new job run
    #   - Replace: If it is time for a new job run and the previous job run hasn't finished yet, the cron job
    #            replaces the currently running job run with a new job run
    concurrencyPolicy: Forbid

    # -- Specify schedule time of its jobs to be created and executed.
    schedule: "5 0 * * *"

    # -- Parameter specify how many completed jobs should be kept.
    successfulJobsHistoryLimit: 1

    # -- Parameter specify how many failed jobs should be kept.
    failedJobsHistoryLimit: 1

    # -- Allow to set time to life (TTL) for TTL controller. TTL controller cleans up the Job, it will delete the Job
    # cascading, i.e. delete its dependent objects, such as Pods, together with the Job.
    # Useful to set a value other than 0 if you want to see job logs.
    ttlSecondsAfterFinished: 0

    # -- SecurityContext holds pod-level security attributes.
    securityContext: {}

    # -- SecurityContext holds container-level security attributes.
    containerSecurityContext: {}

    # -- Allow defining which Nodes the Pods are scheduled on.
    nodeSelector: {}

    # -- Tolerations allow the pods to schedule onto nodes with matching taints.
    tolerations: {}

    # -- lookback related extra env vars to be configured on the concerned components.
    extraEnv: []

    # -- Specify extra configMap mounts for lookback.
    extraConfigmapMounts: []

    # -- Specify extra secret mounts for lookback.
    extraSecretMounts: []

    # -- The resources describe to compute resource requests and limits for single Pods. Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # -- PriorityClassName assigned to the Pods to prevent them from evicting.
    # priorityClassName: "priorityClassName"

  # -- `elasticsearch.rollover.install=true` only creates and manages rollover
  # indices/aliases. Collector and query must also be configured with
  # `elasticsearch.useAliases=true`; otherwise they continue writing to daily
  # indices and may fail with `index_not_found_exception` if index auto-creation
  # is disabled.
  # @default -- see the rows below
  rollover:
    # -- Allow disabling create rollover cronJob.
    install: false

    # -- A docker image to use for rollover cronJob.
    # image: "jaegertracing/jaeger-es-rollover:1.72.0"

    # -- A name of a microservice to deploy with. This name will be used as name of the microservice cronjob and in labels.
    name: rollover

    # -- initHook configuration
    initHook:
      # -- A name of a microservice to deploy with. This name will be used as name of the microservice init job.
      name: rollover-init

      # -- TTL in seconds after finished initial job.
      ttlSecondsAfterFinished: 120

      # -- rollover init related extra env vars to be configured on the concerned components.
      extraEnv: []

    # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet attempts to pull (download) the specified image. Available value : "IfNotPresent", "Always" and "Never"
    imagePullPolicy: IfNotPresent

    # -- Only pods which provide own keys can access the private registry.
    imagePullSecrets: []

    # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
    labels: {}

    # -- Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
    annotations: {}

    # -- It specifies how to treat concurrent executions of a job that is created by this cron job.
    #   - Allow: The cron job allows concurrently running jobs.
    #   - Forbid: The cron job does not allow concurrent runs; if it is time for a new job run and the previous job
    #             run hasn't finished yet, the cron job skips the new job run
    #   - Replace: If it is time for a new job run and the previous job run hasn't finished yet, the cron job
    #            replaces the currently running job run with a new job run
    concurrencyPolicy: Forbid

    # -- Specify schedule time of its jobs to be created and executed.
    schedule: "10 0 * * *"

    # -- Parameter specify how many completed jobs should be kept.
    successfulJobsHistoryLimit: 1

    # -- Parameter specify how many failed jobs should be kept.
    failedJobsHistoryLimit: 1

    # -- Allow to set time to life (TTL) for TTL controller. TTL controller cleans up the Job, it will delete the Job
    # cascading, i.e. delete its dependent objects, such as Pods, together with the Job.
    # -Useful to set a value other than 0 if you want to see job logs.
    ttlSecondsAfterFinished: 0

    # -- SecurityContext holds pod-level security attributes.
    securityContext: {}

    # -- SecurityContext holds container-level security attributes.
    containerSecurityContext: {}

    # -- Allow defining which Nodes the Pods are scheduled on.
    nodeSelector: {}

    # -- Tolerations allow the pods to schedule onto nodes with matching taints.
    tolerations: {}

    # -- rollover related extra env vars to be configured on the concerned components.
    extraEnv: []

    # -- Specify extra configMap mounts for rollover.
    extraConfigmapMounts: []

    # -- Specify extra secret mounts for rollover.
    extraSecretMounts: []

    # -- The resources describe to compute resource requests and limits for single Pods. Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # -- PriorityClassName assigned to the Pods to prevent them from evicting.
    # priorityClassName: "priorityClassName"

# -- Cassandra storage connection settings for collector, query and related secrets.
# Schema initialization is performed by collector/query on startup (Jaeger v2.x).
# @default -- see the rows below
cassandraSchemaJob:
  # -- This is the host used to connect to Cassandra.
  host: ~

  # -- This is the port used to connect to Cassandra.
  port: 9042

  # -- Name of existing secret with cassandra username and password.
  existingSecret: ""

  # -- List of allowed authenticators for gocql driver
  # Full list of supported authenticators can be found in the gocql source code: https://github.com/apache/cassandra-gocql-driver/blob/34fdeebefcbf183ed7f916f931aa0586fdaa1b40/conn.go#L27
  allowedAuthenticators: []

  # -- TLS configuration
  tls:
    # -- Allow disabling create tls.
    enabled: false

    # -- Name of existing secret with SSL certificates. If specified, all subsequent parameters in tls section are ignored.
    existingSecret: ""

    # -- Allow to specify common name - server name protected by the SSL certificate. Ignored if the existingSecret is specified.
    # commonName:

    # -- Allow to specify CA certificate. It use to provide list of trusted CA who issued the certificates. Mandatory field when using SSL connection to Cassandra. Ignored if the existingSecret is specified.
    # ca: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----

    # -- Allow to specify public key of certificate. Mandatory field when using SSL connection to Cassandra. Ignored if the existingSecret is specified.
    # cert: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----

    # -- Allow to specify private part of certificate. Mandatory field when using SSL connection to Cassandra. Ignored if the existingSecret is specified.
    # key: |
    #   -----BEGIN RSA PRIVATE KEY-----
    #   ...
    #   -----END RSA PRIVATE KEY-----

  # -- Parameter specifies the Cassandra datacenter.
  datacenter: ""

  # -- Parameter specifies the Cassandra keyspace for Jaeger.
  keyspace: "jaeger"

  # -- Parameter specifies whether to create the Cassandra keyspace or not
  createKeyspace: true

  # -- Username for Cassandra with access to HTTP API.
  username: ""

  # -- Password for Cassandra with access to HTTP API.
  password: ""

  # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
  labels: {}

  # Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
  annotations: {}

  # -- TTL settings
  ttl: {}
    # -- Time to live for trace data, in seconds, minutes, hours. Default: 172800s (2 days)
    # trace: 172800s

    # -- Time to live for dependencies data, in seconds, minutes, hours. Default: 0, no TTL
    # dependencies: 0

  # -- PriorityClassName assigned to the Pods to prevent them from evicting.
  # priorityClassName: "priorityClassName"

# -- Settings for remote gRPC storage
remotegRPC:
  # -- Endpoint of remote gRPC server in format host:port
  endpoint: ""
  # -- Connection timeout
  timeout: ""

  # -- TLS settings for remote gRPC server.
  tls:
    # -- Allow disabling create tls.
    enabled: false

    # -- Name of existing secret with SSL certificates. If specified, all subsequent parameters in tls section are ignored.
    existingSecret: ""

    # -- Allow to specify CA certificate. It use to provide list of trusted CA who issued the certificates. Mandatory field when using SSL connection to remote gRPC server. Ignored if the existingSecret is specified.
    # ca: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----

    # -- Allow to specify public key of certificate. Mandatory field when using SSL connection to remote gRPC server. Ignored if the existingSecret is specified.
    # cert: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----

    # -- Allow to specify private part of certificate. Mandatory field when using SSL connection to remote gRPC server. Ignored if the existingSecret is specified.
    # key: |
    #   -----BEGIN RSA PRIVATE KEY-----
    #   ...
    #   -----END RSA PRIVATE KEY-----

    # -- insecureSkipVerify will enable TLS but not verify the certificate.
    # insecureSkipVerify: true

# -- Collector configuration
# @default -- see the rows below
collector:
  # -- Allow disabling create collector deployment.
  install: true

  # -- A docker image to use for collector deployment.
  # image: "jaegertracing/jaeger:2.13.0"

  # -- A name of a microservice to deploy with. This name will be used as name of the microservice deployment and in labels.
  name: collector

  # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet attempts to pull (download) the specified image. Available value : "IfNotPresent", "Always" and "Never"
  imagePullPolicy: IfNotPresent

  # -- Only pods which provide own keys can access the private registry.
  imagePullSecrets: []

  # -- Replicas spec configuration for collector.
  replicas: 1

  # -- Additional settings for OTLP receiver
  # @default -- see the rows below
  otlp:
    # -- Additional settings for OTLP gRPC receiver
    # See  https://pkg.go.dev/google.golang.org/grpc/keepalive#ServerParameters
    grpc:
      # -- The maximum amount of time a connection may exist. Set this value to a few seconds or minutes on highly elastic environments,
      # so that clients discover new collector nodes frequently.
      maxConnectionAge: ""

      # -- The additive period after MaxConnectionAge after which the connection will be forcibly closed.
      maxConnectionAgeGrace: ""

      # -- The maximum receivable message size for the collector's gRPC server. Default: 4
      maxRecvMsgSizeMib: ""

    http:
      # -- IdleTimeout is the maximum amount of time to wait for the next request when keep-alive are enabled.
      # If zero, the value of ReadTimeout is used. If negative, or if zero and ReadTimeout is zero or negative, there is no timeout.
      idleTimeout: ""

      # -- ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset
      # after reading the headers and the Handler can decide what is considered too slow for the body. If zero, the value of
      # ReadTimeout is used. If negative, or if zero and ReadTimeout is zero or negative, there is no timeout.
      readHeaderTimeout: ""

      # -- ReadTimeout is the maximum duration for reading the entire request, including the body.
      # A zero or negative value means there will be no timeout.
      # Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or
      # upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
      readTimeout: ""

      cors:
        # -- AllowedOrigins sets the allowed values of the Origin header for HTTP/JSON requests to an OTLP receiver.
        # An origin may contain a wildcard (*) to replace 0 or more characters (e.g., "http://*.domain.com", or "*" to allow any origin).
        allowedOrigins: ""

        # -- AllowedHeaders sets what headers will be allowed in CORS requests The Accept, Accept-Language, Content-Type, and Content-Language
        # headers are implicitly allowed. If no headers are listed, X-Requested-With will also be accepted by default.
        # Include "*" to allow any request header.
        allowedHeaders: ""

        # -- MaxAge sets the value of the Access-Control-Max-Age response header.
        # Set it to the number of seconds that browsers should cache a CORS preflight response for.
        maxAge: ""

  # Additional settings for Jaeger (Legacy) receiver
  jaeger:
    # -- Additional settings for Jaeger (Legacy) gRPC receiver
    # See  https://pkg.go.dev/google.golang.org/grpc/keepalive#ServerParameters
    grpc:
      # -- The maximum amount of time a connection may exist. Set this value to a few seconds or minutes on highly elastic environments, so that clients discover new collector nodes frequently.
      maxConnectionAge: ""

      # -- The additive period after MaxConnectionAge after which the connection will be forcibly closed.
      # See  https://pkg.go.dev/google.golang.org/grpc/keepalive#ServerParameters
      maxConnectionAgeGrace: ""

      # -- The maximum receivable message size for the collector's gRPC server in Mi. Default: 4
      maxRecvMsgSizeMib: ""

    # -- Additional settings for Jaeger (Legacy) HTTP receiver
    http:
      # -- IdleTimeout is the maximum amount of time to wait for the next request when keep-alive are enabled.
      # If zero, the value of ReadTimeout is used. If negative, or if zero and ReadTimeout is zero or negative, there is no timeout.
      idleTimeout: ""

      # -- ReadTimeout is the maximum duration for reading the entire request, including the body.
      # A zero or negative value means there will be no timeout.
      # Because ReadTimeout does not let Handlers make per-request decisions on each request body's acceptable deadline or
      # upload rate, most users will prefer to use ReadHeaderTimeout. It is valid to use them both.
      readTimeout: ""

      # -- ReadHeaderTimeout is the amount of time allowed to read request headers. The connection's read deadline is reset
      # after reading the headers and the Handler can decide what is considered too slow for the body. If zero, the value of
      # ReadTimeout is used. If negative, or if zero and ReadTimeout is zero or negative, there is no timeout.
      readHeaderTimeout: ""

  # Additional settings for Zipkin receiver
  zipkin:

    # -- Comma-separated CORS allowed headers.
    # See https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Access-Control-Allow-Headers
    cors:
      # -- AllowedHeaders sets what headers will be allowed in CORS requests The Accept, Accept-Language, Content-Type, and Content-Language
      allowedHeaders: ""

      # -- Comma-separated CORS allowed origins.
      allowedOrigins: ""

    # -- Allow disabling Keep-Alive.
    disableKeepAlives: false

  # -- TLS configuration for collector.
  # @default -- see the rows below
  tlsConfig:
    # -- TLS configuration from existing secret. If specified, all subsequent parameters in tls section are ignored.
    # existingSecret: ""

    # -- Name of the secret that will be used for both generateCerts and createSecret sections below.
    # Must be specified if existingSecret is not configured.
    # newSecretName: jaeger-collector-tls-secret

    # -- Use generateCerts section if you want cert-manager to generate secret. Will be ignored if existingSecret is already specified.
    generateCerts:
      enabled: true
      clusterIssuerName: ""
      duration: 365
      renewBefore: 15

    # -- Use createSecret section to create secret with already known content of TLS certificates.
    # Do not use createSecret if you use generateCerts. Will be ignored if existingSecret is already specified.
    createSecret: {}
    #   ca: ""
    #   key: ""
    #   cert: ""

    # -- TLS configuration for OTEL HTTP endpoint.
    otelHttp:
      # -- Allow disabling/enabling tls.
      enabled: false

      # -- Comma-separated list of cipher suites for the server. Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      cipherSuites: ""

      # -- Maximum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      maxVersion: ""

      # -- Minimum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      minVersion: ""

      # -- The duration after which the certificate will be reloaded (0s means will not be reloaded)
      certificateReloadInterval: ""

    # -- TLS configuration for OTEL gRPC endpoint.
    otelgRPC:
      # -- Allow disabling/enabling tls.
      enabled: false

      # -- Comma-separated list of cipher suites for the server. Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      # Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      cipherSuites: ""

      # -- Maximum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      maxVersion: ""

      # -- Minimum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      minVersion: ""

      # -- The duration after which the certificate will be reloaded (0s means will not be reloaded)
      certificateReloadInterval: ""

    # -- TLS configuration for Jaeger/Thrift HTTP endpoint.
    jaegerHttp:
      # -- Allow disabling/enabling tls.
      enabled: false

      # -- Comma-separated list of cipher suites for the server. Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      # Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      cipherSuites: ""

      # -- Maximum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      maxVersion: ""

      # -- Minimum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      minVersion: ""

    # -- TLS configuration for Jaeger/Thrift gRPC endpoint.
    jaegergRPC:
      # -- Allow disabling/enabling tls.
      enabled: false

      # -- Comma-separated list of cipher suites for the server. Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      cipherSuites: ""

      # -- Maximum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      maxVersion: ""

      # -- Minimum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      minVersion: ""

    # -- TLS configuration for Zipkin HTTP endpoint.
    zipkin:
      # -- Allow disabling/enabling tls.
      enabled: false

      # -- Comma-separated list of cipher suites for the server. Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      # Values are from tls package constants (https://golang.org/pkg/crypto/tls/#pkg-constants)
      cipherSuites: ""

      # -- Maximum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      maxVersion: ""

      # -- Minimum TLS version supported (Possible values: 1.0, 1.1, 1.2, 1.3)
      minVersion: ""

  # -- Collector related cmd line opts to be configured on the concerned components.
  cmdlineParams: []

  # -- Collector related extra env vars to be configured on the concerned components.
  extraEnv: []

  # -- Enable SAMPLING_STRATEGIES_FILE
  samplingConfig: false

  # -- Enable port of zipkin service.
  zipkinPort: 9411

  # -- SecurityContext holds pod-level security attributes.
  securityContext: {}

  # -- ContainerSecurityContext holds container-level security attributes.
  containerSecurityContext: {}

  # -- Allow defining which Nodes the Pods are scheduled on.
  nodeSelector: {}

  # -- Tolerations allow the pods to schedule onto nodes with matching taints.
  tolerations: {}

  # -- If specified, the pod's scheduling constraints. More info: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#affinity-v1-core
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - jaeger-collector
        topologyKey: kubernetes.io/hostname

  # -- The resources describe to compute resource requests and limits for single Pods. Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 100Mi

  # -- Sampling configuration.
  sampling:
    # -- Remote sampling type can be either "file" or "adaptive".
    # If type is "file", sampling configuration is loaded from file /etc/jaeger/sampling/sampling.json
    type: ""

    # -- Adaptive Sampling works by observing received spans and recalculating sampling probabilities
    # for each service/endpoint combination to ensure that the volume of collected traces matches target_samples_per_second.
    adaptive:

      # -- When a new service or endpoint is detected, it is sampled with initial_sampling_probability until enough data is collected
      # to calculate the rate appropriate for the traffic going through the endpoint. Default: 0.001
      initialSamplingProbability: ""

      # -- Defines desired rate at which data samples are collected or processed per second. Default: 1
      targetSamplesPerSecond: ""

  # -- PriorityClassName assigned to the Pods to prevent them from evicting.
  # priorityClassName: "priorityClassName"

  # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
  labels: {}

  # Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
  annotations: {}

  # -- Ingress configuration.
  # @default -- see the rows below
  ingress:

    # -- HTTP Ingress configuration.
    # @default -- see the rows below
    http:
      # -- Allow creating the Ingress for the HTTP collector endpoints.
      # When the parameter is not specified, the Ingress is created if a host is resolved,
      # either from the "host"/"hosts" parameters below or from CLOUD_PUBLIC_URL, and if
      # GATEWAY_SYSTEM_TYPE allows creating Ingresses. Set it to "false" to never create it.
      install: false

      # -- Add annotation that prevents Gateway API converter from processing this Ingress.
      # Use it when HTTPRoute/GRPCRoute analogue is already configured.
      # The annotation is added automatically when GATEWAY_SYSTEM_TYPE contains "gateway-api-default".
      addGatewayApiAnnotation: false

      # -- Labels for the Ingress.
      labels:
        deployment.netcracker.com/ingress-type: private-network
        deployment.netcracker.com/ingress-audience-type: ops-user

      # -- Hosts for the Ingress.
      hosts: []

      defaultPaths:
      # Format:
      # - prefix: <endpoint>
      #   service:
      #     name: <service_name>
      #     port: <port_number>
      - prefix: /
        service:
          # name: jaeger-collector
          port: 13133
      - prefix: /zipkin
        service:
          port: 9411
      - prefix: /otlp/http
        service:
          port: 4318
      - prefix: /thrift/tchannel
        service:
          port: 14250
      - prefix: /thrift/http
        service:
          port: 14268

    # -- gRPC Ingress configuration.
    # @default -- see the rows below
    grpc:
      # -- Allow creating the Ingress for the gRPC collector endpoints.
      # When the parameter is not specified, the Ingress is created if a host is resolved,
      # either from the "host"/"hosts" parameters below or from CLOUD_PUBLIC_URL, and if
      # GATEWAY_SYSTEM_TYPE allows creating Ingresses. Set it to "false" to never create it.
      install: false

      # -- Add annotation that prevents Gateway API converter from processing this Ingress.
      # Use it when HTTPRoute/GRPCRoute analogue is already configured.
      # The annotation is added automatically when GATEWAY_SYSTEM_TYPE contains "gateway-api-default".
      addGatewayApiAnnotation: false

      # -- Labels for the Ingress.
      labels:
        deployment.netcracker.com/ingress-type: private-network
        deployment.netcracker.com/ingress-audience-type: ops-user

      # -- Hosts for the Ingress.
      hosts: []

      # -- Default paths for the Ingress.
      defaultPaths:
      # Format:
      # - prefix: <endpoint>
      #   service:
      #     name: <service_name>
      #     port: <port_number>
      - prefix: /otlp/grpc
        service:
          port: 4317
      - prefix: /thrift/grpc
        service:
          port: 14250

    # -- TLS configuration for the Ingress.
    tls: {}

  # -- HTTPRoute configuration.
  # @default -- see the rows below
  httpRoute:
    # -- Allow creating the HTTPRoute for the HTTP collector endpoints even if GATEWAY_SYSTEM_TYPE does not contain
    # "gateway-api-default". When the parameter is not specified, the HTTPRoute is created if
    # GATEWAY_SYSTEM_TYPE contains "gateway-api-default" and a hostname is resolved, either
    # from the parameters of the route, from the matching Ingress or from CLOUD_PUBLIC_URL.
    # Set it to "false" to never create it.
    install: false

    # -- Labels for the HTTPRoute.
    labels: {}

    # -- Annotations for the HTTPRoute.
    annotations: {}

    # -- List of parent Gateway references. When the list is empty, the route is attached to the
    # shared external Gateway resolved from GATEWAY_SYSTEM_NAME and GATEWAY_SYSTEM_NAMESPACE.
    parentRefs: []
    # Format:
    # - name: <gateway_name>
    #   namespace: <gateway_namespace>
    #   sectionName: <listener_name>
    #   kind: Gateway
    #   group: gateway.networking.k8s.io
    # List of hostnames for the route. When the list is empty, the hosts of the HTTP collector
    # Ingress (collector.ingress.http.host and collector.ingress.http.hosts) are used.

    # -- List of hostnames for the route. When the list is empty, the hosts of the HTTP collector
    hosts: []

    # -- Default paths for the HTTPRoute.
    # Format:
    # - prefix: <endpoint>
    #   rewritePrefix: <replacement_prefix>
    #   service:
    #     name: <service_name>
    #     port: <port_number>
    #     weight: <backend_weight>, 1 by default
    defaultPaths:
    - prefix: /
      service:
        port: 13133
    - prefix: /zipkin
      rewritePrefix: /
      service:
        port: 9411
    - prefix: /otlp/http
      rewritePrefix: /
      service:
        port: 4318
    - prefix: /thrift/tchannel
      rewritePrefix: /
      service:
        port: 14250
    - prefix: /thrift/http
      rewritePrefix: /
      service:
        port: 14268

  # -- gRPCRoute configuration.
  # @default -- see the rows below
  grpcRoute:
    # -- Allow creating the route for the gRPC collector endpoints even if GATEWAY_SYSTEM_TYPE does not contain
    # "gateway-api-default". When the parameter is not specified, the route is created if
    # GATEWAY_SYSTEM_TYPE contains "gateway-api-default" and a hostname is resolved, either
    # from the parameters of the route, from the matching Ingress or from CLOUD_PUBLIC_URL.
    # Set it to "false" to never create it.
    install: false

    # -- Available values: HTTPRoute, GRPCRoute
    kind: HTTPRoute

    # -- Labels for the gRPCRoute.
    labels: {}

    # -- Annotations for the gRPCRoute.
    annotations: {}

    # -- List of parent Gateway references. When the list is empty, the route is attached to the
    # shared external Gateway resolved from GATEWAY_SYSTEM_NAME and GATEWAY_SYSTEM_NAMESPACE.
    # Format:
    # - name: <gateway_name>
    #   namespace: <gateway_namespace>
    #   sectionName: <listener_name>
    #   kind: Gateway
    #   group: gateway.networking.k8s.io
    parentRefs: []

    # -- List of hostnames for the route. When the list is empty, the hosts of the gRPC collector
    # Ingress (collector.ingress.grpc.host and collector.ingress.grpc.hosts) are used.
    hosts: []

    # -- Default paths for the gRPCRoute.
    # Format:
    # - prefix: <grpc_method_path>
    #   service:
    #     name: <service_name>
    #     port: <port_number>
    #     weight: <backend_weight>, 1 by default
    defaultPaths:
    - prefix: /opentelemetry.proto.collector.trace.v1.TraceService/Export
      service:
        port: 4317

    # -- Rules for native GRPCRoute rendering.
    # Use this section when kind is set to GRPCRoute.
    # If the list is empty, the chart creates a default rule that routes all
    # matched gRPC requests to <serviceName>-collector:4317.
    #
    # Format:
    # - matches:
    #   - method:
    #       service: opentelemetry.proto.collector.trace.v1.TraceService
    #       method: Export
    #   backendRefs:
    #   - name: jaeger-collector
    #     port: 4317
    rules: []

  # -- Jaeger collector config, contains only several options to configure, other part of parameters take from
  # cassandraSchemaJob and elasticsearch sections
  config:
    service:
      telemetry:
        logs:
          level: info
    processors:
      memory_limiter:
        # Enable memory limiter processor to prevent OOM issues
        # Type: boolean
        # Default: false
        #
        enabled: false
        # How often to check memory usage
        # Type: string (duration)
        # Default: "1s"
        #
        check_interval: 1s
        # Hard memory limit in MiB. When exceeded, garbage collection is triggered
        # Should be set to approximately 75-80% of pod memory limit
        # Default collector memory limit is 200Mi, so default is 150Mi (75% of 200Mi)
        # Type: integer
        # Default: 150
        #
        limit_mib: 150
        # Allowed memory spike in MiB. Soft limit = limit_mib - spike_limit_mib
        # When soft limit is exceeded, processor starts rejecting incoming data
        # Should be set to approximately 15-20% of pod memory limit
        # Default collector memory limit is 200Mi, so default is 30Mi (15% of 200Mi)
        # Type: integer
        # Default: 30
        #
        spike_limit_mib: 30
    exporters:
      jaeger_storage_exporter:
        # Retry configuration to save data in database
        retry_on_failure:
          enabled: true
          initial_interval: 10s
          max_interval: 1m
          max_elapsed_time: 5m
        # Queue and batch configuration
        queue:
          enabled: true
          num_consumers: 100
          queue_size: 1000

  # -- Custom config for the collector. Allows to override the default config and specify a full custom config for the collector
  # customConfig:
  #   service:
  #     telemetry:
  #       logs:
  #         level: info

# -- Hotrod configuration.
# @default -- see the rows below
hotrod:
  # -- Allow disabling create hotrod deployment.
  install: false

  # -- A docker image to use for hotrod deployment.

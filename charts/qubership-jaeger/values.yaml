  #         level: info

# -- Integration tests configuration.
# @default -- see the rows below
integrationTests:
  # -- Integration tests configuration.
  install: false

  # -- A docker image to use for integration tests container.
  # image: "ghcr.io/netcracker/jaeger-integration-tests:main"

  # -- Tags for the integration tests.
  tags: "smokeORmemory_limiter"

  # -- Hook delete policy.
  hookDeletePolicy: "before-hook-creation,hook-succeeded,hook-failed"

  # -- Link for the generator.
  linkForGenerator: "http://jaeger-collector:9411"

  # -- Generate count.
  generateCount: 10

  # -- Waiting time.
  waitingTime: 500ms

  # -- The resources describe to compute resource requests and limits for single Pods.
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 300m

  # -- Service for the integration tests.
  service:
    name: jaeger-integration-tests-runner

  # -- Status writing configuration.
  statusWriting:
    # -- Allow enabling status writing.
    enabled: true

    # -- Allow enabling short status message.
    isShortStatusMessage: true

    # -- Allow only integration tests.
    onlyIntegrationTests: true

    # -- Custom resource path.
    # customResourcePath: "apps/v1/<namespace_name>/deployments/<deployment_name>"

  # -- Service account for the integration tests.
  serviceAccount:
    create: true
    name: "jaeger-integration-tests"

  # -- SecurityContext holds pod-level security attributes.
  securityContext: {}

  # -- ContainerSecurityContext holds container-level security attributes.
  containerSecurityContext: {}

  # -- PriorityClassName assigned to the Pods to prevent them from evicting.
  # priorityClassName: "priorityClassName"

# -- Status provisioner configuration.
# @default -- see the rows below
statusProvisioner:
  # -- Allow disabling create status provisioner deployment.
  install: true

  # -- A docker image to use for status provisioner container.
  # image: ghcr.io/netcracker/qubership-deployment-status-provisioner:main

  # -- Lifetime after completion.
  lifetimeAfterCompletion: 300

  # -- Pod readiness timeout.
  podReadinessTimeout: 300

  # -- Integration tests timeout.
  integrationTestsTimeout: 900

  # -- The resources describe to compute resource requests and limits for single Pods.
  resources:
    requests:
      memory: "50Mi"
      cpu: "50m"
    limits:
      memory: "100Mi"
      cpu: "100m"

  # -- Resource to set status.
  resourceToSetStatus: "jaeger-collector"

  # -- SecurityContext holds pod-level security attributes.
  securityContext: {}

  # -- ContainerSecurityContext holds container-level security attributes.
  containerSecurityContext: {}

  # -- PriorityClassName assigned to the Pods to prevent them from evicting.
  # priorityClassName: "priorityClassName"

# -- Readiness probe configuration.
readinessProbe:
  # -- Allow disabling create readiness-probe deployment.
  install: true

  # -- A docker image to use for readiness-probe container.
  # image: "ghcr.io/netcracker/jaeger-readiness-probe:main"

  # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet
  # attempts to pull (download) the specified image. Available value : "IfNotPresent", "Always" and "Never"
  imagePullPolicy: IfNotPresent

  # -- Command line arguments
  # args:
  #   - "-host=cassandra.cassandra.svc"
  #   - "-port=9042"
  #   - "-user=admin"
  #   - "-password=admin"
  #   - "-errors=5"
  #   - "-retries=5"
  #   - "-timeout=5"

  # -- How often (in seconds) to perform the readiness probe.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
  # periodSeconds: 10

  # -- Number of seconds after which the readiness probe times out.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
  # timeoutSeconds: 5

  # -- The resources describe to compute resource requests and limits for single Pods.
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 50m
      memory: 50Mi

  # -- ContainerSecurityContext holds container-level security attributes.
  containerSecurityContext: {}


# -- Spark dependencies configuration.
# @default -- see the rows below
spark:
  # -- Allow disabling creation of SparkDependencies cron job
  install: false

  # -- Map of string keys and values that can be used to organize and categorize (scope and select) objects.
  labels: {}

  # -- Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata.
  annotations: {}

  # -- A docker image to use for SparkDependencies container.
  # image: "ghcr.io/jaegertracing/spark-dependencies/spark-dependencies:latest"

  # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet
  # attempts to pull (download) the specified image. Available value : "IfNotPresent", "Always" and "Never"
  imagePullPolicy: IfNotPresent

  # -- Only pods which provide own keys can access the private registry.
  imagePullSecrets: []

  # -- Java options to pass to spark dependencies job
  javaOpts: ""

  # -- The name of the secret containing the truststore password
  trustStoreSecretName: "jaeger-spark-dependencies-truststore-secret"

  # -- Elasticsearch configuration for the spark dependencies job
  elasticsearch:
    # -- Optional date separator of Jaeger indices. For example `.` will find index "jaeger-span-2020.11.25"
    indexDateSeparator: ""

    # -- How far in the past the job should look to for spans, the maximum and default is `24h`.
    # Any value accepted by (https://www.elastic.co/guide/en/elasticsearch/reference/current/common-options.html#date-math)
    # can be used here, but the anchor is always `now`.
    timeRange: ""

    # -- Set to true to use index alias names to read from and write to.Usually required when using rollover indices.
    useAliases: ""

  # -- Defines how k8s/openshift manages failures of containers.
  # Always: Automatically restarts the container after any termination.
  # OnFailure: Only restarts the container if it exits with an error (non-zero exit status).
  # Never: Does not automatically restart the terminated container.
  restartPolicy: ""

  # -- The resources describe to compute resource requests and limits for single Pods.
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 100Mi
  init:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 128Mi

  # -- The password for the java truststore
  # truststorePassword: "password"

  # -- Allow defining which Nodes the Pods are scheduled on.
  nodeSelector: {}

  # -- Tolerations allow the pods to schedule onto nodes with matching taints.
  tolerations: {}

  # -- If specified, the pod's scheduling constraints
  # More info: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#affinity-v1-core
  affinity: {}

  # -- Specifies how to treat concurrent executions of a Job that is created by this CronJob. The spec may specify only one of the following concurrency policies:
  # Allow: The CronJob allows concurrently running Jobs
  # Forbid: The CronJob does not allow concurrent runs; if it is time for a new Job run and the previous Job run hasn't finished yet,
  # the CronJob skips the new Job run. Also note that when the previous Job run finishes, .spec.startingDeadlineSeconds is still taken into account and may result in a new Job run.
  # Replace: If it is time for a new Job run and the previous Job run hasn't finished yet, the CronJob replaces the currently running Job run with a new Job run
  concurrencyPolicy: Forbid

  # -- This field specifies the number of successful finished jobs to keep. Setting this field to 0 will not keep any successful jobs.
  successfulJobsHistoryLimit: 5

  # -- This field specifies the number of failed finished jobs to keep. Setting this field to 0 will not keep any failed jobs.
  failedJobsHistoryLimit: 5

  # -- The activeDeadlineSeconds applies to the duration of the job, no matter how many Pods are created.
  # Once a Job reaches activeDeadlineSeconds, all of its running Pods are terminated and the Job status will become type: Failed with reason: DeadlineExceeded.
  activeDeadlineSeconds: ""

  # -- Kubernetes TTL-after-finished controller provides a TTL (time to live) mechanism to limit the lifetime of Job objects that have finished execution.
  ttlSecondsAfterFinished: ""

  # -- SecurityContext holds pod-level security attributes.
  securityContext: {}

  # -- ContainerSecurityContext holds container-level security attributes.
  containerSecurityContext: {}

  # -- PriorityClassName assigned to the Pods to prevent them from evicting.
  # priorityClassName: "priorityClassName"

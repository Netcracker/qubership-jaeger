{{- $httpRouteSpec := .Values.hotrod.httpRoute | default dict -}}
{{- $hostnames := $httpRouteSpec.hosts | default (list (include "hotrod.ingress" .)) -}}
{{- $name := printf "%s-hotrod" .Values.jaeger.serviceName -}}
{{- $install := or ($httpRouteSpec.install | default false) (and .Values.hotrod.ingress.install (include "jaeger.gatewayApi.enabled" .)) -}}
{{- if and .Values.hotrod.install $install }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/instance: {{ cat .Values.jaeger.serviceName "-hotrod-" .Release.Namespace | nospace | trunc 63 | trimSuffix "-" }}
    {{- include "jaeger.labels" (dict "ctx" . "name" $name "component" "hotrod") | nindent 4 }}
    {{- if $httpRouteSpec.labels }}
      {{- toYaml $httpRouteSpec.labels | nindent 4 }}
    {{- end }}
  {{- if $httpRouteSpec.annotations }}
  annotations:
    {{- toYaml $httpRouteSpec.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "jaeger.gatewayApi.parentRefs" (dict "ctx" $ "parentRefs" $httpRouteSpec.parentRefs) | nindent 4 }}
  {{- if $hostnames }}
  hostnames:
    {{- include "jaeger.gatewayApi.hostnames" (dict "ctx" $ "hosts" $hostnames) | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ .Values.jaeger.serviceName }}-hotrod
          port: {{ .Values.hotrod.service.port }}
{{- end }}

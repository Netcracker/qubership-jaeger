{{- if and (include "proxy.oauth2.tls.caEnabled" .) (not .Values.proxy.oauth2.tls.existingSecret) }}
---
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "proxy.oauth2.tls.secretName" . }}
  labels:
    {{- $name := include "proxy.oauth2.tls.secretName" . -}}
    {{- include "jaeger.labels" (dict "ctx" . "name" $name "component" "query") | nindent 4 }}
    {{- if .Values.query.labels }}
      {{- toYaml .Values.query.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.query.annotations }}
  annotations:
    {{- toYaml .Values.query.annotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ca-cert.pem: |
    {{- .Values.proxy.oauth2.tls.ca | trim | nindent 4 }}
{{- end }}

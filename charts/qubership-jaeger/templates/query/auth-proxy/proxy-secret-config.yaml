{{- if .Values.proxy.install }}
{{- $authz := .Values.proxy.oauth2.authorization }}
{{- include "proxy.oauth2.tls.validate" . }}
{{- if eq .Values.proxy.type "oauth2" }}
  {{- include "proxy.oauth2.authorization.validate" . }}
{{- end }}
---
kind: Secret
apiVersion: v1
metadata:
  name: proxy-config
  labels:
    {{- $name := "proxy-config" -}}
    {{- include "jaeger.labels" (dict "ctx" . "name" $name "component" "query") | nindent 4 }}
    {{- if .Values.query.labels }}
      {{- toYaml .Values.query.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.query.annotations }}
  annotations:
    {{- toYaml .Values.query.annotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yaml: |-
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901
    {{- if eq .Values.proxy.type "oauth2" }}
    static_resources:
      listeners:
      - name: listener_proxy
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 16688
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: auto
              stat_prefix: ingress_http
              {{- if .Values.proxy.access_logs_enabled }}
              access_log:
              - name: "envoy.access_loggers.stdout"
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      timestamp: "%START_TIME%"
                      level: "info"
                      logType: "audit"
                      request: "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %REQ(X-FORWARDED-FOR)% %REQ(USER-AGENT)% %REQ(X-REQUEST-ID)% %REQ(:AUTHORITY)%"
                      response: "%PROTOCOL% %RESPONSE_CODE% %RESPONSE_FLAGS%"
              {{- end }}
              {{- if $authz.enabled }}
              # Envoy answers 403 both when the policy denies the user and when the token fails the audience check.
              # Keep the original reason in the body and add a hint for the user.
              local_reply_config:
                mappers:
                - filter:
                    status_code_filter:
                      comparison:
                        op: EQ
                        value:
                          default_value: 403
                          runtime_key: proxy_authorization_denied_status
                  body_format_override:
                    text_format_source:
                      inline_string: "Access to Jaeger UI is denied: %LOCAL_REPLY_BODY%.\nAsk your administrator for access, or open /signout to sign in as another user.\n"
              {{- end }}
              route_config:
                name: local_route
                virtual_hosts:
                - name: upstream
                  domains:
                  - "*"
                  routes:
                  - match:
                      prefix: /
                    route:
                      cluster: upstream-service
              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(request_handle)
                        local path = request_handle:headers():get(":path")
                        local cookie = request_handle:headers():get("cookie")
                        if path and string.sub(path, 1, 5) == "/api/" and (not cookie or not string.find(cookie, "OauthHMAC=")) then
                          request_handle:respond(
                            {
                             [":status"] = "401",
                             ["content-type"] = "application/json"
                            },
                            "Unauthorized"
                          )
                        end
                      end
              - name: envoy.filters.http.oauth2
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                  config:
                    token_endpoint:
                      cluster: auth
                      uri: {{ .Values.proxy.oauth2.tokenEndpoint }}
                      timeout: 5s
                    authorization_endpoint: {{ .Values.proxy.oauth2.authorizationEndpoint }}
                    redirect_uri: "https://%REQ(:authority)%/callback"
                    auth_scopes: "openid profile"
                    redirect_path_matcher:
                      path:
                        exact: /callback
                    signout_path:
                      path:
                        exact: /signout
                    credentials:
                      client_id: {{ .Values.proxy.oauth2.clientId }}
                      token_secret:
                        name: token
                        sds_config:
                          resource_api_version: V3
                          path_config_source: {"path": /envoy/oauth2/token-secret.yaml}
                      hmac_secret:
                        name: hmac
                        sds_config:
                          resource_api_version: V3
                          path_config_source: {"path": /envoy/oauth2/hmac-secret.yaml}
                    forward_bearer_token: true
              {{- if $authz.enabled }}
              {{- $rolesPath := list (dict "key" "jwt_payload") }}
              {{- range $authz.rolesClaim }}
                {{- $rolesPath = append $rolesPath (dict "key" .) }}
              {{- end }}
              {{- $userPath := list (dict "key" "jwt_payload") (dict "key" $authz.userClaim) }}
              - name: envoy.filters.http.jwt_authn
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                  providers:
                    idp:
                      {{- if $authz.issuer }}
                      issuer: {{ $authz.issuer | toJson }}
                      {{- end }}
                      {{- if $authz.audiences }}
                      audiences: {{ $authz.audiences | toJson }}
                      {{- end }}
                      remote_jwks:
                        http_uri:
                          uri: {{ $authz.jwksUri | toJson }}
                          cluster: auth
                          timeout: 5s
                        cache_duration: 600s
                      payload_in_metadata: jwt_payload
                      forward: true
                  rules:
                  - match:
                      prefix: /
                    requires:
                      provider_name: idp
              - name: envoy.filters.http.rbac
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  rules:
                    action: ALLOW
                    policies:
                      jaeger-ui-access:
                        permissions:
                        - any: true
                        # Principals are ORed: one matching role or user is enough.
                        # Each role gets two matchers. The roles claim is a list for most identity providers,
                        # but ADFS sends a plain string when the user has a single group.
                        principals:
                        {{- range $authz.allowedRoles }}
                        - sourced_metadata:
                            metadata_matcher:
                              filter: envoy.filters.http.jwt_authn
                              path: {{ $rolesPath | toJson }}
                              value:
                                list_match:
                                  one_of:
                                    string_match:
                                      exact: {{ . | toJson }}
                        - sourced_metadata:
                            metadata_matcher:
                              filter: envoy.filters.http.jwt_authn
                              path: {{ $rolesPath | toJson }}
                              value:
                                string_match:
                                  exact: {{ . | toJson }}
                        {{- end }}
                        {{- range $authz.allowedUsers }}
                        - sourced_metadata:
                            metadata_matcher:
                              filter: envoy.filters.http.jwt_authn
                              path: {{ $userPath | toJson }}
                              value:
                                string_match:
                                  exact: {{ . | toJson }}
                        {{- end }}
              {{- end }}
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: auth
        connect_timeout: 5s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: auth
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.proxy.oauth2.idpAddress }}
                    port_value: {{ .Values.proxy.oauth2.idpPort }}
        {{- if and .Values.proxy.oauth2.authorizationEndpoint (hasPrefix "https://" .Values.proxy.oauth2.authorizationEndpoint) }}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: {{ .Values.proxy.oauth2.idpAddress }}
            {{- if include "proxy.oauth2.tls.caEnabled" . }}
            common_tls_context:
              validation_context:
                trusted_ca:
                  filename: /envoy/idp-ca/ca-cert.pem
                # Envoy does not check the hostname of the certificate unless a SAN matcher is set.
                match_typed_subject_alt_names:
                {{- if or (regexMatch "^[0-9]+(\\.[0-9]+){3}$" .Values.proxy.oauth2.idpAddress) (contains ":" .Values.proxy.oauth2.idpAddress) }}
                - san_type: IP_ADDRESS
                {{- else }}
                - san_type: DNS
                {{- end }}
                  matcher:
                    exact: {{ .Values.proxy.oauth2.idpAddress | quote }}
            {{- end }}
        {{- end }}
      - name: upstream-service
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: upstream-service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 16686
    {{- else }}
    static_resources:
      listeners:
      - name: listener_proxy
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: 16688
        filter_chains:
        - filters:
          - name: envoy.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              {{- if .Values.proxy.access_logs_enabled }}
              access_log:
              - name: "envoy.access_loggers.stdout"
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      timestamp: "%START_TIME%"
                      level: "info"
                      logType: "audit"
                      request: "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %REQ(X-FORWARDED-FOR)% %REQ(USER-AGENT)% %REQ(X-REQUEST-ID)% %REQ(:AUTHORITY)%"
                      response: "%PROTOCOL% %RESPONSE_CODE% %RESPONSE_FLAGS%"
              {{- end }}
              route_config:
                name: local_route
                virtual_hosts:
                - name: upstream
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: upstream-service
                    metadata:
                      filter_metadata:
                        envoy.filters.http.lua:
                          credentials:
                          {{- range .Values.proxy.basic.users }}
                            - "Basic {{ . }}"
                          {{- end }}
              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(request_handle)
                        for _, credential in pairs(request_handle:metadata():get("credentials")) do
                          if request_handle:headers():get("authorization") == credential
                          then
                            return
                          end
                        end
                        request_handle:respond(
                          {[":status"] = "401", ["WWW-Authenticate"] = "Basic realm=\"Unknown\""}, "Unauthorized"
                        )
                      end
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: upstream-service
        connect_timeout: 25s
        type: LOGICAL_DNS
        # Comment out the following line to test on v6 networks
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: upstream-service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: localhost
                    port_value: 16686
    {{- end }}
{{- end }}

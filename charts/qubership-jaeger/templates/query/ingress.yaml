{{- $ingressSpec := .Values.query.ingress | default dict -}}
{{- $host := include "query.ingress" . -}}
{{- $exposed := include "jaeger.exposureEnabled" (dict "flags" (list $ingressSpec.install) "host" $host) -}}
{{- if and .Values.query.install $exposed (include "jaeger.legacyIngress.enabled" .) }}
{{- $annotations := deepCopy (.Values.query.annotations | default dict) -}}
{{- if or .Values.query.ingress.addGatewayApiAnnotation (include "jaeger.gatewayApi.enabled" .) }}
{{- $_ := set $annotations "gateway-api-converter.netcracker.com/ignore" "true" -}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.jaeger.serviceName }}-query
  labels:
    {{- $name := printf "%s-query" .Values.jaeger.serviceName -}}
    {{- include "jaeger.labels" (dict "ctx" . "name" $name "component" "query") | nindent 4 }}
    {{- if .Values.query.labels }}
      {{- toYaml .Values.query.labels | nindent 4 }}
    {{- end }}
    {{- if .Values.query.ingress.labels }}
      {{- toYaml .Values.query.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: 256k
    {{- if $annotations }}
    {{- toYaml $annotations | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.query.ingress.className }}
  ingressClassName: {{ .Values.query.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            {{- if semverCompare "<1.21-0" .Capabilities.KubeVersion.GitVersion }}
            backend:
              serviceName: {{ .Values.jaeger.serviceName }}-query
              servicePort: "http-query"
            {{- else }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.jaeger.serviceName }}-query
                port:
                  name: "http-query"
            {{- end }}
  {{- if .Values.query.ingress.tls }}
  tls:
    {{- toYaml .Values.query.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
